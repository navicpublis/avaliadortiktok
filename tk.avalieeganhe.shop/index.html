<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok — Conclua nossa pesquisa e ganhe até R$850</title>

<style>
body {
  margin: 0;
  background: #000;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

.container {
  width: 100%;
  max-width: 900px;
  padding: 20px;
}

video {
  width: 100%;
  border-radius: 12px;
  box-shadow: 0 0 30px rgba(255,255,255,0.1);
  outline: none;
}

h1 {
  font-size: 22px;
  margin-bottom: 20px;
  font-weight: normal;
  color: #ccc;
}
</style>
</head>

<body>

<div class="container">
  <h1 style="margin-bottom: 20px; color: #ccc; font-size: 22px;">Assista ao vídeo para continuar:</h1>
  <video id="vsl" controls playsinline preload="metadata" style="width: 100%; border-radius: 12px; box-shadow: 0 0 30px rgba(255,255,255,0.1);">
    <source src="media/vsl.mp4" type="video/mp4">
    Seu navegador não suporta vídeos.
  </video>
  <div id="cta-container" style="display: none; margin-top: 20px;">
    <a href="https://google.com" style="display: inline-block; padding: 15px 30px; background: #fe2c55; color: white; text-decoration: none; font-weight: bold; border-radius: 5px; font-size: 18px;">CONTINUAR PARA A PESQUISA &rarr;</a>
  </div>
</div>

<script>
  const video = document.getElementById('vsl');
  const cta = document.getElementById('cta-container');
  video.onended = function() {
    cta.style.display = 'block';
  };
</script>

</body>
</html>
